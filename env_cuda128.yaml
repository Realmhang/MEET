name: unimomo_meet
channels:
  - pytorch
  - nvidia
  - bioconda
  - conda-forge
  - pyg
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - biopython=1.80
  - biotite=1.1.0
  - scikit-learn=1.6.1
  - scipy=1.13.1
  - pandas=2.2.3
  - pyyaml=6.0.3
  - omegaconf=2.3.0
  - tensorboard=2.12.1
  - bioconda::mmseqs2=17.b804f
  - openmm=8.2.0
  - openbabel=3.1.1
  - pdbfixer=1.11
  - dockq=2.1.3
  - plip=2.3.1
  - tqdm=4.67.1
  - easydict=1.13
  - wandb=0.19.8
  - sympy=1.13.3
  - packaging=24.2 # for torch.utils.tensorboard
  - networkx=3.4.2
  - rdkit=2024.9.6
  - bioconda::anarci=2024.05.21
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - --find-links https://data.pyg.org/whl/torch-2.8.0+cu128.html
    - torch==2.8.0+cu128
    - torch-scatter==2.1.2 # if not work, manually use pip install --no-cache-dir torch-scatter to build from source
    - torch-cluster==1.6.3
    - xformers==0.0.32.post2
    - rdkit-pypi==2022.3.5
    - vina==1.2.7
    - meeko==0.1.dev3
    - pdb2pqr==3.6.2 # as well as python -m pip install git+https://github.com/Valdes-Tresanco-MS/AutoDockTools_py3
    - posebusters==0.3.6
    - ray==2.44.0
    - openpyxl==3.1.5
    - prolif==2.0.3
    - swanlab==0.7.3 # optional experiment logger; use tensorboard or wandb if not installed
